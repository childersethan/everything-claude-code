<section id="work">
  <div class="wrap">
    <div class="sec-head reveal">
      <span class="eyebrow">Our work</span>
      <h2>From the field</h2>
      <p class="lede">Windmills, solar wells, stock tanks and water lines. Tap a photo to see it full size.</p>
    </div>
    <div class="gallery" id="gallery"></div>
  </div>
</section>

<dialog class="lightbox" id="lightbox" aria-label="Job photo">
  <figure><img id="lbImg" alt=""><figcaption id="lbCap"></figcaption></figure>
  <div class="lb-ctrl">
    <button type="button" id="lbPrev" aria-label="Previous photo">←</button>
    <button type="button" id="lbClose" aria-label="Close">✕</button>
    <button type="button" id="lbNext" aria-label="Next photo">→</button>
  </div>
</dialog>
